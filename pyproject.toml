[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manifex-cci"
version = "0.1.0"
description = "Evidence-driven creative capability inventory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cci = "manifex_cci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
